<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #head { left: 0; width: 1920px; top: 50px; text-align: center; font-size: 104px; letter-spacing: 6px; }
  .lab { font-size: 32px; }
  .earth { border-radius: 50%; background: radial-gradient(circle at 35% 35%, #7fc4ff, #1e5fa8 55%, #0a2240); box-shadow: 0 0 60px #4ea4ff77; }
  .moon { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f2f2f2, #a9a9a9 55%, #4a4a4a); box-shadow: 0 0 40px #ffffff44; }
.col { width: 440px; text-align: center; top: 760px; }
  .h { font-size: 120px; }
  .when { font-size: 30px; margin-top: 10px; color: #c9d3e8; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stars"></div>
  <div id="head" class="abs anton">HOW LONG IS A DAY?</div>
  <svg class="abs" width="1920" height="1080" style="left:0;top:0">
    <g id="c1" transform="translate(440 480)"><circle r="170" fill="none" stroke="#ffffff22" stroke-width="26"/><circle id="a1" r="170" fill="none" stroke="#c9d3e8" stroke-width="26" transform="rotate(-90)" stroke-dasharray="0 2000"/></g>
    <g id="c2" transform="translate(960 480)"><circle r="170" fill="none" stroke="#ffffff22" stroke-width="26"/><circle id="a2" r="170" fill="none" stroke="#ff8a30" stroke-width="26" transform="rotate(-90)" stroke-dasharray="0 2000"/></g>
    <g id="c3" transform="translate(1480 480)"><circle r="170" fill="none" stroke="#ffffff22" stroke-width="26"/><circle id="a3" r="170" fill="none" stroke="#ffd60a" stroke-width="26" transform="rotate(-90)" stroke-dasharray="0 2000" style="filter: drop-shadow(0 0 10px #ffd60a)"/></g>
  </svg>
  <div id="t1" class="abs col" style="left:220px"><div class="anton h">18.5 H</div><div class="mont when">1.4 BILLION YEARS AGO</div></div>
  <div id="t2" class="abs col" style="left:740px"><div class="anton h" style="color:#ff8a30">23.5 H</div><div class="mont when">AGE OF DINOSAURS</div></div>
  <div id="t3" class="abs col" style="left:1260px"><div class="anton h y">24 H</div><div class="mont when">TODAY</div></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const C = 2 * Math.PI * 170;
  const arc = (id, h) => ({ attr: { "stroke-dasharray": (C * h / 24) + " 2000" } });
  tl.fromTo("#head", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 0)
    .to("#a1", { ...arc("#a1", 18.5), duration: 0.8, ease: "power2.out" }, 0.3)
    .fromTo("#t1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3 }, 0.5)
    .to("#a2", { ...arc("#a2", 23.5), duration: 0.8, ease: "power2.out" }, 1.4)
    .fromTo("#t2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3 }, 1.6)
    .to("#a3", { ...arc("#a3", 24), duration: 0.8, ease: "power2.out" }, 2.5)
    .fromTo("#t3", { opacity: 0, y: 30, scale: 1.3 }, { opacity: 1, y: 0, scale: 1, duration: 0.3 }, 2.7)
    .to("#root", { scale: 1.04, duration: 6, ease: "none" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
