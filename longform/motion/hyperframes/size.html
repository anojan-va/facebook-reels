<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #ground { left: 160px; width: 1600px; top: 780px; height: 4px; background: #ffffff55; transform-origin: left; }
  #head { width: 1920px; top: 60px; text-align: center; font-size: 120px; letter-spacing: 6px; }
  .lab { font-size: 34px; text-align: center; width: 600px; }
  #rock { left: 930px; top: 220px; width: 560px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8a8a8a 0%, #4b4b4b 45%, #1d1d1d 80%);
    box-shadow: inset -40px -50px 90px #000c, 0 0 60px rgba(255,140,40,.25); }
  .crater { position: absolute; border-radius: 50%; background: radial-gradient(circle at 60% 65%, #6b6b6b, #2a2a2a 70%);
    box-shadow: inset 6px 8px 14px #000a; }
  #measure { left: 1540px; top: 220px; width: 6px; height: 560px; background: #ffd60a; transform-origin: bottom;
    box-shadow: 0 0 16px #ffd60a; }
  .tick { position: absolute; left: -22px; width: 50px; height: 6px; background: #ffd60a; }
  #ten { left: 1580px; top: 420px; font-size: 150px; white-space: nowrap; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
  <div class="stars"></div>
  <div id="head" class="abs anton clip" data-start="0" data-duration="3">TEN KILOMETRES OF ROCK</div>
  <svg id="everest" class="abs" width="1920" height="1080" style="left:0;top:0">
    <polygon id="mt" points="260,780 470,420 520,470 600,287 690,430 740,390 900,780" fill="#2a3142" stroke="#c9d3e8" stroke-width="4"/>
    <polygon points="560,370 600,287 640,350 620,345 600,365 580,350" fill="#e8eef9" />
  </svg>
  <div id="evlab" class="abs mont lab" style="left:280px;top:810px">MOUNT EVEREST<br/><span style="color:#c9d3e8">8.8 KM</span></div>
  <div id="rock" class="abs">
    <div class="crater" style="left:120px;top:110px;width:120px;height:110px"></div>
    <div class="crater" style="left:320px;top:200px;width:80px;height:80px"></div>
    <div class="crater" style="left:200px;top:330px;width:150px;height:130px"></div>
    <div class="crater" style="left:400px;top:360px;width:60px;height:60px"></div>
  </div>
  <div id="rocklab" class="abs mont lab" style="left:910px;top:810px">THE ASTEROID<br/><span class="y">10 KM</span></div>
  <div id="measure" class="abs"><div class="tick" style="top:0"></div><div class="tick" style="bottom:0"></div></div>
  <div id="ten" class="abs anton y">10<span style="font-size:70px;color:#fff;text-shadow:none"> KM</span></div>
  <div id="ground" class="abs"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#head", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 0)
    .fromTo("#ground", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0)
    .fromTo("#everest", { y: 500 }, { y: 0, duration: 0.45, ease: "back.out(1.4)" }, 0.1)
    .fromTo("#evlab", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25 }, 0.35)
    .fromTo("#rock", { y: -900, rotation: -40 }, { y: 0, rotation: 0, duration: 0.5, ease: "power3.in" }, 0.45)
    .fromTo("#root", { y: 0 }, { y: 14, duration: 0.05, yoyo: true, repeat: 5 }, 0.95)
    .fromTo("#measure", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, 1.0)
    .fromTo("#ten", { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.out" }, 1.25)
    .fromTo("#rocklab", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25 }, 1.3)
    .to("#rock", { rotation: 8, duration: 2.0, ease: "none" }, 0.95)
    .to("#root", { scale: 1.04, duration: 3, ease: "none" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
