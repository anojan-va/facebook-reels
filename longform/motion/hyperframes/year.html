<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #root { background: radial-gradient(ellipse at 50% 40%, #2a1610 0%, #0b0706 75%); }
  #head { left: 0; width: 1920px; top: 50px; text-align: center; font-size: 104px; letter-spacing: 6px; }
  .lab { font-size: 32px; }
  .earth { border-radius: 50%; background: radial-gradient(circle at 35% 35%, #7fc4ff, #1e5fa8 55%, #0a2240); box-shadow: 0 0 60px #4ea4ff77; }
  .mars { border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffb27a, #c4521f 55%, #4a1606); box-shadow: 0 0 60px #ff7a3a77; }
.row { left: 260px; width: 1400px; }
  .bar { position: absolute; left: 300px; top: 10px; height: 110px; border-radius: 12px; transform-origin: left; }
  .nm { position: absolute; left: 0; top: 30px; font-size: 52px; }
  .val { position: absolute; top: 18px; font-size: 96px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stars"></div>
  <div id="head" class="abs anton">ONE YEAR IS...</div>
  <div class="abs row" style="top:330px"><div class="nm mont" style="color:#7fc4ff">EARTH</div><div id="b1" class="bar" style="width:530px;background:#4ea4ff"></div><div id="v1" class="val anton" style="left:860px">365 DAYS</div></div>
  <div class="abs row" style="top:560px"><div class="nm mont" style="color:#ff9a5a">MARS</div><div id="b2" class="bar" style="width:1000px;background:#e0642a"></div><div id="v2" class="val anton y" style="left:1330px">687</div></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#head", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 0)
    .fromTo("#b1", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 0.3)
    .fromTo("#v1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.9)
    .fromTo("#b2", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.out" }, 1.3)
    .fromTo("#v2", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, 2.4)
    .to("#root", { scale: 1.04, duration: 6, ease: "none" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
