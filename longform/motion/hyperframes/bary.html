<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #head { left: 0; width: 1920px; top: 50px; text-align: center; font-size: 104px; letter-spacing: 6px; }
  .lab { font-size: 32px; }
  .earth { border-radius: 50%; background: radial-gradient(circle at 35% 35%, #7fc4ff, #1e5fa8 55%, #0a2240); box-shadow: 0 0 60px #4ea4ff77; }
  .moon { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f2f2f2, #a9a9a9 55%, #4a4a4a); box-shadow: 0 0 40px #ffffff44; }
#wrap { left: 960px; top: 500px; width: 0; height: 0; }
  #e { left: -190px; top: -190px; width: 380px; height: 380px; }
  #m { left: 1040px; top: -55px; width: 110px; height: 110px; }
  #bc { left: 960px; top: 500px; width: 22px; height: 22px; margin: -11px; border-radius: 50%; background: #ffd60a; box-shadow: 0 0 22px #ffd60a; }
  #bclab { left: 760px; top: 720px; width: 400px; text-align: center; font-size: 30px; }
  #km { left: 0; width: 1920px; top: 800px; text-align: center; font-size: 90px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stars"></div>
  <div id="head" class="abs anton">THE EARTH–MOON DANCE</div>
  <svg class="abs" width="1920" height="1080" style="left:0;top:0"><circle id="orbitE" cx="960" cy="500" r="140" fill="none" stroke="#ffffff33" stroke-width="3" stroke-dasharray="10 10"/></svg>
  <div id="spin" class="abs" style="left:960px;top:500px;width:0;height:0">
    <div id="e" class="abs earth" style="left:-330px"></div>
    <div id="m" class="abs moon" style="left:760px"></div>
  </div>
  <div id="bc" class="abs"></div>
  <div id="bclab" class="abs mont lab y">▲ SHARED BALANCE POINT</div>
  <div id="km" class="abs anton y">4,700 KM FROM EARTH'S CENTRE</div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#head", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 0)
    .fromTo("#spin", { rotation: 18 }, { rotation: -18, duration: 6, ease: "sine.inOut" }, 0)
    .fromTo("#e", { rotation: -18 }, { rotation: 18, duration: 6, ease: "sine.inOut" }, 0)
    .fromTo("#bc", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.0)
    .fromTo("#bclab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.2)
    .fromTo("#km", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 1.8)
    .to("#m", { opacity: 0, scale: 0.2, duration: 0.4, ease: "power2.in" }, 4.4)
    .to("#root", { scale: 1.04, duration: 6, ease: "none" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
