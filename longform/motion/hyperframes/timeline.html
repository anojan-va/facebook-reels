<!doctype html>
<html lang="en" data-composition-variables='[{"id":"stop","type":"number","label":"Active stop (0-8)","default":0},{"id":"from","type":"number","label":"Fill starts at stop (-1 = stop-1)","default":-1},{"id":"label","type":"string","label":"Big readout","default":""},{"id":"dur","type":"number","label":"Fill duration","default":0.6},{"id":"set","type":"string","label":"Stop set (years|days)","default":"years"},{"id":"head","type":"string","label":"Header","default":"TIME WITHOUT HUMANS"}]'>
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #root { background: radial-gradient(ellipse at 50% 40%, #12201a 0%, #050807 75%); }
  #head { left: 0; width: 1920px; top: 50px; text-align: center; font-size: 104px; letter-spacing: 6px; }
  .stop { top: 420px; width: 190px; text-align: center; margin-left: -95px; }
  .dot { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 22px; background: #2b3a33; border: 4px solid #9fd8b6; }
  .n { font-size: 50px; line-height: 1; color: #7f948a; }
  .u { font-size: 26px; line-height: 1.3; letter-spacing: 3px; color: #7f948a; }
  #line { left: 200px; top: 435px; width: 1520px; height: 6px; background: #2b3a33; }
  #fill { left: 200px; top: 435px; width: 1520px; height: 6px; background: #ffd60a; transform-origin: left; box-shadow: 0 0 14px #ffd60a; }
  #big { left: 0; width: 1920px; top: 700px; text-align: center; font-size: 190px; color: #ffd60a; text-shadow: 0 0 40px rgba(255,214,10,.45); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stars"></div>
<!-- variables -->
  <div id="head" class="abs anton">TIME WITHOUT HUMANS</div>
  <div id="line" class="abs"></div><div id="fill" class="abs"></div>
  <div id="big" class="abs anton"></div>
</div>
<script>
  const V = window.__hyperframes.getVariables();
  const SETS = {years: [["1","HOUR"],["1","DAY"],["1","WEEK"],["1","MONTH"],["1","YEAR"],["10","YEARS"],["100","YEARS"],["1,000","YEARS"],["10,000","YEARS"]],
                days: [["DAY","1"],["DAY","2"],["DAY","3"],["DAY","4"],["DAY","5"],["DAY","6"],["DAY","7"]],
                oil: [["1","HOUR"],["1","DAY"],["1","WEEK"],["1","MONTH"],["1","YEAR"],["10","YEARS"]]};
  const STOPS = SETS[V.set] || SETS.years;
  document.getElementById("head").textContent = V.head || "TIME WITHOUT HUMANS";
  const N = STOPS.length - 1;
  const root = document.getElementById("root");
  STOPS.forEach(([a, b], i) => {
    const [n, u] = V.set === "days" ? [b, a] : [a, b];
    const s = document.createElement("div"); s.className = "abs stop"; s.style.left = (200 + i * 1520 / N) + "px";
    s.innerHTML = V.set === "days" ? `<div class="dot"></div><div class="u anton">${u}</div><div class="n anton">${n}</div>`
                                   : `<div class="dot"></div><div class="n anton">${n}</div><div class="u anton">${u}</div>`;
    root.appendChild(s);
  });
  const tl = gsap.timeline({ paused: true });
  const k = Math.round(V.stop), f = V.from < 0 ? Math.max(0, k - 1) : V.from, D = V.dur;
  const big = document.getElementById("big"); big.textContent = V.label || "";
  const stops = document.querySelectorAll(".stop");
  tl.fromTo("#head", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 0)
    .fromTo("#fill", { scaleX: f / N }, { scaleX: k / N, duration: D, ease: "power2.inOut" }, 0.05);
  stops.forEach((s, i) => {
    if (i > k) return;
    // passed stops light up as the fill reaches them; stops before the start are lit from frame 0
    const at = i <= f && i < k ? 0 : 0.05 + D * (k === f ? 1 : (i - f) / (k - f));
    const on = i === k ? "#ffd60a" : "#ffffff";
    tl.to(s.querySelector(".dot"), { backgroundColor: "#ffd60a", borderColor: "#ffd60a", duration: 0.12 }, at)
      .to(s.querySelectorAll(".n,.u"), { color: on, duration: 0.12 }, at);
  });
  tl.fromTo(stops[k], { scale: 1 }, { scale: 1.3, duration: 0.25, ease: "back.out(2)", transformOrigin: "50% 0%" }, 0.05 + D)
    .fromTo("#big", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: big.textContent ? 1 : 0, duration: 0.3, ease: "power4.out" }, 0.1)
    .to("#root", { scale: 1.04, duration: 6, ease: "none" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
