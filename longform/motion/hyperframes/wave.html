<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #head { left: 0; width: 1920px; top: 50px; text-align: center; font-size: 110px; letter-spacing: 6px; }
  .lab { font-size: 32px; }
#ground { left: 0; width: 1920px; top: 800px; height: 6px; background: #c9d3e8; }
  #burj { left: 1350px; top: 469px; width: 60px; height: 331px; }
  #blab { left: 1180px; top: 820px; width: 400px; text-align: center; }
  #wlab { left: 260px; top: 820px; width: 700px; text-align: center; }
  #hlab { left: 830px; top: 200px; font-size: 130px; white-space: nowrap; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stars"></div>
  <div id="head" class="abs anton">THE FIRST WAVE</div>
  <svg class="abs" width="1920" height="1080" style="left:0;top:0">
    <defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfefff"/><stop offset="0.25" stop-color="#2a8fd0"/><stop offset="1" stop-color="#06233d"/></linearGradient></defs>
    <path id="wave" d="M 0 800 L 0 420 Q 300 210 560 200 Q 780 200 820 330 Q 700 260 640 340 Q 760 560 1040 800 Z" fill="url(#w)" stroke="#e8f7ff" stroke-width="4"/>
  </svg>
  <svg id="burj" class="abs" viewBox="0 0 60 331"><polygon points="30,0 34,60 40,140 48,240 56,331 4,331 12,240 20,140 26,60" fill="#c9d3e8"/></svg>
  <div id="ground" class="abs"></div>
  <div id="hlab" class="abs anton y">≈ 1.5 KM</div>
  <div id="wlab" class="abs mont lab">MODELLED FIRST WAVE · RANGE ET AL. 2022</div>
  <div id="blab" class="abs mont lab">BURJ KHALIFA<br/><span style="color:#c9d3e8">828 M</span></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#head", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 0)
    .fromTo("#burj", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.3)" }, 0.15)
    .fromTo("#blab", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.4)
    .fromTo("#wave", { x: -1100 }, { x: 0, duration: 1.1, ease: "power2.out" }, 0.5)
    .fromTo("#hlab", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, 1.5)
    .fromTo("#wlab", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 1.6)
    .to("#root", { scale: 1.04, duration: 5, ease: "none" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
