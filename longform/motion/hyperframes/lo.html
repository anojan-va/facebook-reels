<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #root { background: radial-gradient(ellipse at 50% 50%, #0b1a0e 0%, #020403 80%); font-family: "Courier New", monospace; }
  #scr { left: 260px; top: 120px; width: 1400px; height: 840px; border-radius: 40px; border: 6px solid #1e3a22; box-shadow: inset 0 0 120px #0a2a10, 0 0 60px #000; }
  .ln { left: 340px; font-size: 64px; color: #46ff6e; text-shadow: 0 0 18px #46ff6eaa; white-space: pre; font-weight: bold; }
  #l1 { top: 200px; font-size: 40px; color: #2fbf4e; }
  #l2 { top: 300px; font-size: 40px; color: #2fbf4e; }
  #l3 { top: 430px; font-size: 150px; }
  #cur { top: 430px; font-size: 150px; }
  #err { left: 0; width: 1920px; top: 720px; text-align: center; font-size: 110px; color: #eb3232; font-family: Anton; text-shadow: 0 0 30px #eb323288; }
  #scan { left: 260px; top: 120px; width: 1400px; height: 840px; border-radius: 40px;
          background: repeating-linear-gradient(0deg, #0000 0 3px, #0006 3px 5px); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <div id="scr" class="abs"></div>
  <div id="l1" class="abs ln">UCLA → STANFORD RESEARCH INSTITUTE</div>
  <div id="l2" class="abs ln">OCT 29, 1969 · 22:30</div>
  <div id="l3" class="abs ln"></div>
  <div id="err" class="abs">SYSTEM CRASHED</div>
  <div id="scan" class="abs"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const l3 = document.getElementById("l3");
  const txt = ["> ", "> L", "> LO", "> LO_"];
  tl.fromTo("#scr,#scan", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0)
    .fromTo("#l1", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0.2)
    .fromTo("#l2", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0.4);
  txt.forEach((t, i) => tl.call(() => { l3.textContent = t; }, null, 0.6 + i * 0.55));
  tl.call(() => { l3.textContent = "> LO"; }, null, 0.59)
    .call(() => { l3.textContent = "> "; }, null, 0.58);
  tl.fromTo("#err", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, 2.4)
    .to("#l3", { x: 8, duration: 0.05, yoyo: true, repeat: 7 }, 2.4)
    .to("#scr", { borderColor: "#5a1a1a", duration: 0.2 }, 2.4)
    .fromTo("#root", { scale: 1 }, { scale: 1.05, duration: 8, ease: "none" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
