<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #head { left: 0; width: 1920px; top: 50px; text-align: center; font-size: 104px; letter-spacing: 6px; }
  .lab { font-size: 32px; }
  .earth { border-radius: 50%; background: radial-gradient(circle at 35% 35%, #7fc4ff, #1e5fa8 55%, #0a2240); box-shadow: 0 0 60px #4ea4ff77; }
  .moon { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f2f2f2, #a9a9a9 55%, #4a4a4a); box-shadow: 0 0 40px #ffffff44; }
#e { left: 760px; top: 300px; width: 400px; height: 400px; z-index: 2; }
  #ocean { left: 700px; top: 340px; width: 520px; height: 320px; border-radius: 50%; background: radial-gradient(ellipse, #4ea4ffaa 55%, #4ea4ff22 72%, transparent 74%); }
  #m { left: 1640px; top: 440px; width: 120px; height: 120px; }
  #lab1 { left: 0; width: 1920px; top: 790px; text-align: center; font-size: 64px; }
  #lab2 { left: 0; width: 1920px; top: 790px; text-align: center; font-size: 64px; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stars"></div>
  <div id="head" class="abs anton">TWO OCEAN BULGES</div>
  <div id="ocean" class="abs"></div>
  <div id="e" class="abs earth"></div>
  <div id="m" class="abs moon"></div>
  <svg class="abs" width="1920" height="1080" style="left:0;top:0"><line id="pull" x1="1240" y1="500" x2="1620" y2="500" stroke="#ffd60a" stroke-width="6" stroke-dasharray="20 14"/></svg>
  <div id="lab1" class="abs anton y">THE MOON STRETCHES OUR OCEANS</div>
  <div id="lab2" class="abs anton r">MOON GONE: TIDES SHRINK</div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#head", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 0)
    .fromTo("#ocean", { scaleX: 0.8 }, { scaleX: 1.12, duration: 1.4, ease: "power2.out" }, 0.3)
    .fromTo("#pull", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4)
    .fromTo("#lab1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, 0.8)
    .to("#m", { scale: 0, opacity: 0, duration: 0.35, ease: "power3.in" }, 3.0)
    .to("#pull", { opacity: 0, duration: 0.2 }, 3.0)
    .to("#ocean", { scaleX: 0.86, duration: 1.2, ease: "elastic.out(1, 0.4)" }, 3.3)
    .to("#lab1", { opacity: 0, duration: 0.15 }, 3.3)
    .fromTo("#lab2", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, 3.4)
    .to("#root", { scale: 1.04, duration: 6, ease: "none" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
