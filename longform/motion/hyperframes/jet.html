<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #head { left: 0; width: 1920px; top: 50px; text-align: center; font-size: 110px; letter-spacing: 6px; }
  .lab { font-size: 32px; }
#sea { left: 0; width: 1920px; top: 790px; height: 40px; background: linear-gradient(#1f6fa8, #0b2c48); }
  #bed { left: 0; width: 1920px; top: 830px; height: 10px; background: #8a7a5a; }
  #rock { left: 700px; top: 270px; width: 560px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffb36b 0%, #a2461a 35%, #3a1608 75%); box-shadow: 0 0 80px rgba(255,120,30,.6), inset -40px -50px 90px #000c; }
  #alt { left: 1290px; top: 270px; width: 520px; height: 4px; background: #ffd60a; box-shadow: 0 0 12px #ffd60a; transform-origin: left; }
  #jet { left: 1480px; top: 222px; font-size: 64px; }
  #jetlab { left: 1300px; top: 300px; width: 600px; white-space: nowrap; }
  #rocklab { left: 700px; top: 860px; width: 560px; text-align: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stars"></div>
  <div id="head" class="abs anton">FRONT ON THE SEABED&hellip;</div>
  <div id="rock" class="abs"></div>
  <div id="sea" class="abs"></div><div id="bed" class="abs"></div>
  <div id="alt" class="abs"></div>
  <div id="jet" class="abs">&#9992;&#65039;</div>
  <div id="jetlab" class="abs mont lab y">PASSENGER JET<br/><span style="color:#fff;text-shadow:none">CRUISES AT ≈ 10–12 KM</span></div>
  <div id="rocklab" class="abs mont lab">THE ASTEROID · <span class="y">10 KM</span></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#head", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 0)
    .fromTo("#rock", { y: -1000 }, { y: 0, duration: 0.6, ease: "power3.in" }, 0.15)
    .fromTo("#root", { y: 0 }, { y: 12, duration: 0.05, yoyo: true, repeat: 5 }, 0.75)
    .fromTo("#rocklab", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.9)
    .fromTo("#alt", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 1.1)
    .fromTo("#jet", { x: 500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "power2.out" }, 1.2)
    .fromTo("#jetlab", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, 1.6)
    .to("#root", { scale: 1.04, duration: 5, ease: "none" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
