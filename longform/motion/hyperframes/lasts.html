<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #root { background: radial-gradient(ellipse at 50% 40%, #12201a 0%, #050807 75%); }
  #head { left: 0; width: 1920px; top: 50px; text-align: center; font-size: 104px; letter-spacing: 6px; }
  .lab { font-size: 32px; }
.row { left: 160px; width: 1600px; height: 78px; }
  .nm { position: absolute; left: 0; top: 18px; width: 420px; font-size: 30px; white-space: nowrap; text-align: right; }
  .bar { position: absolute; left: 450px; top: 10px; height: 58px; border-radius: 8px; transform-origin: left; }
  .v { position: absolute; top: 10px; font-size: 52px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stars"></div>
  <div id="head" class="abs anton">WHAT LASTS LONGEST?</div>
  <div class="abs row" style="top:230px"><div class="nm mont">WOODEN HOUSES</div><div class="bar b" style="width:140px;background:#8a6a4a"></div><div class="v anton" style="left:610px">~100 YRS</div></div>
  <div class="abs row" style="top:330px"><div class="nm mont">STEEL BRIDGES</div><div class="bar b" style="width:300px;background:#a65a2a"></div><div class="v anton" style="left:770px">CENTURIES</div></div>
  <div class="abs row" style="top:430px"><div class="nm mont">SKYSCRAPERS</div><div class="bar b" style="width:430px;background:#7f948a"></div><div class="v anton" style="left:900px">~1,000 YRS</div></div>
  <div class="abs row" style="top:530px"><div class="nm mont">PLASTIC</div><div class="bar b" style="width:520px;background:#4ea4ff"></div><div class="v anton" style="left:990px">CENTURIES+</div></div>
  <div class="abs row" style="top:630px"><div class="nm mont">PYRAMIDS</div><div class="bar b" style="width:720px;background:#d8b46a"></div><div class="v anton" style="left:1190px">10,000+</div></div>
  <div class="abs row" style="top:730px"><div class="nm mont y">MOON FOOTPRINTS</div><div class="bar b" style="width:1000px;background:#ffd60a;box-shadow:0 0 16px #ffd60a"></div><div class="v anton y" style="left:1470px">MILLIONS</div></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#head", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 0)
    .fromTo(".b", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out", stagger: 0.35 }, 0.3)
    .fromTo(".v", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.35 }, 0.6)
    .to("#root", { scale: 1.04, duration: 6, ease: "none" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
