<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #head { left: 0; width: 1920px; top: 50px; text-align: center; font-size: 110px; letter-spacing: 6px; }
  .lab { font-size: 32px; }
#didy { left: 860px; top: 340px; width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9a9a9a, #4a4a4a 55%, #1a1a1a); }
  #per { left: 0; width: 1920px; top: 690px; text-align: center; font-size: 120px; }
  #plab { left: 0; width: 1920px; top: 650px; text-align: center; font-size: 30px; color: #c9d3e8; }
  #diff { left: 1420px; top: 560px; font-size: 90px; opacity: 0; }
  #flash { left: 0; top: 0; width: 1920px; height: 1080px; background: #fff; opacity: 0; }
  #names { left: 860px; top: 550px; width: 200px; text-align: center; font-size: 24px; color: #c9d3e8; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stars"></div>
  <div id="head" class="abs anton">DART · SEPTEMBER 2022</div>
  <svg class="abs" width="1920" height="1080" style="left:0;top:0">
    <ellipse id="orb" cx="960" cy="440" rx="420" ry="170" fill="none" stroke="#ffffff44" stroke-width="4" stroke-dasharray="14 12"/>
    <circle id="moon" cx="1380" cy="440" r="26" fill="#bdbdbd"/>
    <line id="craft" x1="1800" y1="200" x2="1760" y2="230" stroke="#ffd60a" stroke-width="10" stroke-linecap="round"/>
  </svg>
  <div id="didy" class="abs"></div>
  <div id="names" class="abs mont">DIDYMOS</div>
  <div id="plab" class="abs mont">DIMORPHOS ORBIT TIME</div>
  <div id="per" class="abs anton">11 H 55 MIN</div>
  <div id="per2" class="abs anton y" style="left:0;width:1920px;top:690px;text-align:center;font-size:120px;opacity:0">11 H 23 MIN</div>
  <div id="diff" class="abs anton y">−32 MIN</div>
  <div id="flash" class="abs"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const st = { a: 0, rx: 420, ry: 170 };
  const mv = () => { const m = document.querySelector("#moon"); m.setAttribute("cx", 960 + st.rx * Math.cos(st.a)); m.setAttribute("cy", 440 + st.ry * Math.sin(st.a));
    const o = document.querySelector("#orb"); o.setAttribute("rx", st.rx); o.setAttribute("ry", st.ry); };
  tl.fromTo("#head", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 0)
    .fromTo(["#didy", "#names", "#plab", "#per"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1)
    .to(st, { a: -0.9, duration: 1.2, ease: "none", onUpdate: mv }, 0)
    .fromTo("#craft", { x: 0, y: 0 }, { x: -330, y: 10, duration: 1.2, ease: "power1.in" }, 0)
    .to("#craft", { opacity: 0, duration: 0.01 }, 1.2)
    .to("#flash", { opacity: 0.9, duration: 0.04 }, 1.2).to("#flash", { opacity: 0, duration: 0.3 }, 1.25)
    .fromTo("#root", { x: 0 }, { x: 12, duration: 0.05, yoyo: true, repeat: 5 }, 1.2)
    .to(st, { a: -6.5, rx: 395, ry: 158, duration: 3.8, ease: "none", onUpdate: mv }, 1.2)
    .call(() => {}, null, 1.5)
    .fromTo("#diff", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, 1.9)
    .to("#root", { scale: 1.04, duration: 5, ease: "none" }, 0);
  tl.to("#per", { opacity: 0, duration: 0.1 }, 1.7).fromTo("#per2", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.2 }, 1.7);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
