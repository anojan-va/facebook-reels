<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/common.css" />
<style>
  #root { background: radial-gradient(ellipse at 50% 40%, #2a1610 0%, #0b0706 75%); }
  #head { left: 0; width: 1920px; top: 50px; text-align: center; font-size: 104px; letter-spacing: 6px; }
  .lab { font-size: 32px; }
  .earth { border-radius: 50%; background: radial-gradient(circle at 35% 35%, #7fc4ff, #1e5fa8 55%, #0a2240); box-shadow: 0 0 60px #4ea4ff77; }
  .mars { border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffb27a, #c4521f 55%, #4a1606); box-shadow: 0 0 60px #ff7a3a77; }
#ground { left: 0; width: 1920px; top: 900px; height: 6px; background: #c9b39a; }
  #evlab { left: 120px; top: 600px; width: 300px; text-align: center; }
  #oplab { left: 900px; top: 190px; width: 700px; text-align: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stars"></div>
  <div id="head" class="abs anton">THE BIGGEST VOLCANO</div>
  <svg class="abs" width="1920" height="1080" style="left:0;top:0">
    <polygon id="ev" points="140,900 230,780 250,795 275,706 300,770 330,760 400,900" fill="#3a4256" stroke="#c9d3e8" stroke-width="4"/>
    <path id="om" d="M 520 900 C 900 880 1000 420 1250 416 C 1500 420 1600 880 1900 900 Z" fill="#a6461c" stroke="#ffb27a" stroke-width="5"/>
  </svg>
  <div id="ground" class="abs"></div>
  <div id="evlab" class="abs mont lab">EVEREST<br/><span style="color:#c9d3e8">8.8 KM</span></div>
  <div id="oplab" class="abs mont lab">OLYMPUS MONS<br/><span class="anton y" style="font-size:110px">22 KM</span></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#head", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, 0)
    .fromTo("#ev", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.2)
    .fromTo("#evlab", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.5)
    .fromTo("#om", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 1.0, ease: "power3.out" }, 0.9)
    .fromTo("#oplab", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.25 }, 1.9)
    .to("#root", { scale: 1.04, duration: 6, ease: "none" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
